name: Release (fork)

# Fork release pipeline. Triggered ONLY by fork release tags `vX.Y.Z-local.N`
# (e.g. v0.4.36-local.1):
#   - leading `v` keeps `git describe --match 'v[0-9]*'` (apps/desktop/
#     scripts/package.mjs and the Go CLI ldflags) deriving the right version
#     with zero code changes;
#   - the `-local.N` prerelease suffix keeps fork tags disjoint from upstream
#     stable tags `vX.Y.Z`, which remain owned by multica-ai.
# The upstream release.yml is intentionally absent from this fork: its
# `v*.*.*` glob would match fork tags and double-run the Docker builds.

on:
  push:
    tags:
      - "v*-local.*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-fork-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag name
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "Triggered by tag: $tag"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-local\.[0-9]+$ ]]; then
            echo "::error::Fork release tags must look like vX.Y.Z-local.N; got '$tag'."
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Same policy as the upstream release workflow: releases follow the
          # newest 1.26 patch available to setup-go, independent of the
          # minimum patch in server/go.mod.
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Verify Go test wrapper
        run: bash scripts/test-go.test.sh

      - name: Run tests
        run: bash scripts/test-go.sh --race

      - name: Scan Go vulnerabilities
        working-directory: server
        run: go tool govulncheck ./...

  # Multi-arch images built natively per platform (amd64 on ubuntu-latest,
  # arm64 on ubuntu-24.04-arm) and merged into a manifest list — same shape
  # as the upstream release workflow. Images are pushed to the fork's own
  # GHCR namespace via the lowercased IMAGE_OWNER (repository_owner is not).
  docker-backend-build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          # GHCR refs must be lowercase; repository_owner here is not.
          echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute backend image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_OWNER }}/multica-backend
          labels: |
            org.opencontainers.image.title=Multica Backend (fork)
            org.opencontainers.image.description=Multica self-hosted backend — SIE fork build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-backend-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=release-backend-${{ env.PLATFORM_PAIR }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ env.IMAGE_OWNER }}/multica-backend,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-backend-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-backend-merge:
    needs: [verify, docker-backend-build]
    runs-on: ubuntu-latest
    concurrency:
      group: release-fork-docker-backend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Compute lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-backend-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Every fork tag is a prerelease, so the upstream `is_stable` gate
      # would never publish `latest`. In the fork, latest means "newest fork
      # release" regardless of the -local suffix, so it is always tagged.
      - name: Compute backend image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_OWNER }}/multica-backend
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.ref_name }}
            type=sha,prefix=sha-

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ env.IMAGE_OWNER }}/multica-backend@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ env.IMAGE_OWNER }}/multica-backend:${{ steps.meta.outputs.version }}

  docker-web-build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          # GHCR refs must be lowercase; repository_owner here is not.
          echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute web image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_OWNER }}/multica-web
          labels: |
            org.opencontainers.image.title=Multica Web (fork)
            org.opencontainers.image.description=Multica self-hosted web frontend — SIE fork build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-web-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=release-web-${{ env.PLATFORM_PAIR }}
          build-args: |
            REMOTE_API_URL=http://backend:8080
            NEXT_PUBLIC_APP_VERSION=${{ github.ref_name }}
          outputs: type=image,name=ghcr.io/${{ env.IMAGE_OWNER }}/multica-web,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-web-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-web-merge:
    needs: [verify, docker-web-build]
    runs-on: ubuntu-latest
    concurrency:
      group: release-fork-docker-web-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Compute lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-web-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute web image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_OWNER }}/multica-web
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.ref_name }}
            type=sha,prefix=sha-

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ env.IMAGE_OWNER }}/multica-web@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ env.IMAGE_OWNER }}/multica-web:${{ steps.meta.outputs.version }}

  # Desktop installers for Windows and Linux, published straight to this
  # fork's GitHub Release by electron-builder (--publish always reads the
  # publish.owner from apps/desktop/electron-builder.yml, which points at
  # this fork; the version comes from `git describe`, i.e. the pushed tag).
  # macOS continues to need manual signing/notarization and is not built
  # here. First fork release ships x64 only; add arm64 matrix entries once
  # the pipeline is proven.
  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            arches: "--x64"
          - os: windows-latest
            target: win
            arches: "--x64"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # package.mjs derives the desktop version from `git describe`,
          # which needs full history and tags.
          fetch-depth: 0

      - name: Install rpmbuild (Linux)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Desktop installer (${{ matrix.target }})
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder's GitHub publisher reads this:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned for now — same policy as the upstream Linux/Windows
          # release. Set CSC_LINK in repo secrets to enable signing later.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node scripts/package.mjs --${{ matrix.target }} ${{ matrix.arches }} --publish always

  # Android APK for the mobile client, published to the same GitHub Release
  # as the desktop installers. Debug-signed for now (no keystore secrets) —
  # installable for testing; wire a release keystore through repo secrets
  # before distributing outside the team. The root .npmrc (node-linker=
  # hoisted) is load-bearing here: pnpm's default symlink layout deadlocks
  # CMake/ninja during the native build ("manifest still dirty"), which is
  # exactly what the local Windows build proved out.
  mobile:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android native project
        working-directory: apps/mobile
        env:
          APP_ENV: production
        run: npx expo prebuild -p android --no-install

      # Missing SDK components (NDK 27.1, build-tools 36.0.0) are auto-
      # installed by AGP from the runner's pre-accepted licenses.
      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          # Optional repo variable to override the API URL baked into the
          # APK (e.g. http://192.168.184.61:8080 for the self-hosted
          # backend). Unset = committed .env.production value (official
          # cloud). Env vars beat .env files in Expo, hence the guard.
          EXPO_PUBLIC_API_URL_OVERRIDE: ${{ vars.MULTICA_MOBILE_API_URL }}
        run: |
          if [ -n "$EXPO_PUBLIC_API_URL_OVERRIDE" ]; then
            export EXPO_PUBLIC_API_URL="$EXPO_PUBLIC_API_URL_OVERRIDE"
          fi
          ./gradlew assembleRelease \
            -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease \
            --console=plain

      - name: Rename APK
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "multica-mobile-${GITHUB_REF_NAME}.apk"

      # Appends to the release the desktop jobs create (and creates it if
      # this job finishes first). Prerelease matches every -local.N tag.
      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: multica-mobile-*.apk
          prerelease: true
          fail_on_unmatched_files: true
